<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Nikita Korneenkov — Go Backend Engineer">
  <title>Nikita Korneenkov — Go Backend Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B13"/>
      <stop offset="55%" stop-color="#0A1420"/>
      <stop offset="100%" stop-color="#06121B"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2F7FB"/>
      <stop offset="55%" stop-color="#CFEFFF"/>
      <stop offset="100%" stop-color="#4FD8FF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="60%" stop-color="#5EEAD4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1B3A52" stroke-width="1" opacity="0.30"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>

    <ellipse cx="1010" cy="120" rx="300" ry="220" fill="url(#blobA)">
      <animate attributeName="rx" values="300;340;300" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="120" cy="250" rx="280" ry="180" fill="url(#blobB)">
      <animate attributeName="ry" values="180;215;180" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <!-- channels feeding the runtime -->
    <g stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M660 96 H800 Q846 96 860 140" stroke="#00ADD8" stroke-width="1.6" stroke-dasharray="6 10" opacity="0.55">
        <animate attributeName="stroke-dashoffset" values="64;0" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M660 140 H860" stroke="#5EEAD4" stroke-width="1.6" stroke-dasharray="6 10" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="64;0" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M660 184 H800 Q846 184 860 140" stroke="#7C5CFF" stroke-width="1.6" stroke-dasharray="6 10" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="64;0" dur="2.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- goroutine orbits -->
    <g transform="translate(1000 140)">
      <circle r="102" fill="none" stroke="#1E4A63" stroke-width="1" stroke-dasharray="3 7" opacity="0.7"/>
      <circle r="74" fill="none" stroke="#1E4A63" stroke-width="1" stroke-dasharray="3 7" opacity="0.8"/>
      <circle r="46" fill="none" stroke="#235A76" stroke-width="1" opacity="0.9"/>

      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
        <circle cx="0" cy="-102" r="4" fill="#7C5CFF" filter="url(#glow)"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="15s" repeatCount="indefinite"/>
        <circle cx="0" cy="-102" r="3" fill="#00ADD8" opacity="0.8"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
        <circle cx="0" cy="-74" r="4.5" fill="#5EEAD4" filter="url(#glow)"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="200" to="-160" dur="9s" repeatCount="indefinite"/>
        <circle cx="0" cy="-74" r="3" fill="#5EEAD4" opacity="0.65"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/>
        <circle cx="0" cy="-46" r="4" fill="#4FD8FF" filter="url(#glow)"/></g>

      <circle r="19" fill="#0B1E2B" stroke="#00ADD8" stroke-width="1.5"/>
      <circle r="19" fill="none" stroke="#5EEAD4" stroke-width="1.5" opacity="0.6">
        <animate attributeName="r" values="19;34;19" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#7FE7FF">go</text>
    </g>

    <!-- copy -->
    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
      <text x="64" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" letter-spacing="4.6" fill="#5EEAD4" opacity="0.95">BACKEND &#183; DISTRIBUTED SYSTEMS &#183; MOSCOW / REMOTE</text>
      <text x="64" y="146" font-size="54" font-weight="800" letter-spacing="-0.5" fill="url(#name)">Nikita Korneenkov</text>
      <rect x="64" y="163" width="360" height="2" rx="1" fill="url(#rule)"/>
      <text x="64" y="199" font-size="21" font-weight="500" fill="#A7BED2">Go engineer building systems that stay up under load.</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5">
        <text x="64" y="235" fill="#476E86">$</text>
        <text x="82" y="235" fill="#8FB6CC">7M+ records indexed &#8226; 20&#215; faster pipelines &#8226; millions of conns/day</text>
        <rect x="672" y="223" width="9" height="16" fill="#5EEAD4">
          <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <rect x="0" y="276" width="1200" height="4" fill="url(#rule)" opacity="0.9"/>
  </g>
</svg>
